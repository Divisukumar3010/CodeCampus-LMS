<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeCampus - Learn Without Limits</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/CodeCampus.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    html.dark {
      background-color: #0f172a !important;
    }

    html:not(.dark) {
      background-color: #ffffff !important;
    }

    body {
      background-color: inherit !important;
    }

    html.dark body {
      background-color: #0f172a !important;
    }

    html:not(.dark) body {
      background-color: #ffffff !important;
    }
  </style>

  <!-- Dark Mode Script (IMPORTANT - Add this FIRST, before any rendering) -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      const isDark = savedTheme === 'dark' || (savedTheme === null && prefersDark);

      if (isDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.backgroundColor = '#0f172a';
        <!-- document.body.style.backgroundColor = '#0f172a'; -->
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.style.backgroundColor = '#ffffff';
        // document.body.style.backgroundColor = '#ffffff';
      }
    })();
  </script>


</head>

<body>
  <!-- Root element for React -->
  <div id="root"></div>

  <!-- Your Vite React app script -->
  <script type="module" src="/src/main.jsx"></script>
  <!-- <h2 style="color: #5a5a59;">color</h2> -->
</body>

</html>
